const ivec3 BPATH[11] = ivec3[11](ivec3(6,1,1), ivec3(6,2,1), ivec3(6,2,0), ivec3(5,2,0), ivec3(4,2,0), ivec3(3,3,1),
                                  ivec3(3,4,1), ivec3(3,4,0), ivec3(2,4,0), ivec3(1,4,0), ivec3(0,4,0));
bool onPathEdge(vec2 cid, float o){
  if(cid.x < 0. || cid.x > 6. || cid.y < 1. || cid.y > 4.) return false;
  for(int i=0;i<11;i++){ if(float(BPATH[i].x)==cid.x && float(BPATH[i].y)==cid.y && float(BPATH[i].z)==o) return true; }
  return false;
}
float bEdge(vec2 cid, float perp, float along, float o, float y){
  bool onPath = onPathEdge(cid, o);
  float h = h21(cid*1.37 + o*7.13 + .5);
  if(!onPath && h<.36) return 1e5;
  float a0=0., a1=BS;
  if(!onPath){
    float h2 = h21(cid*3.17 + o*1.31 + 11.);
    if(h2<.3) a1 = BS*(.4+.45*h21(cid+o*5.3));
    else if(h2<.5) a0 = BS*(.15+.4*h21(cid*1.9+o*2.1));
  }
  float d = sdBox2(vec2(perp, along-(a0+a1)*.5), vec2(.09, (a1-a0)*.5));
  if(onPath) d = max(d, -sdBox(vec3(perp, y-1.2, along-2.5), vec3(.4, 1.2, .72)));
  else if(h21(cid*9.3+o*3.1) > .45){
    float dc = mix(a0,a1, .25+.5*h21(cid*7.7+o));
    d = max(d, -sdBox(vec3(perp, y-1.05, along-dc), vec3(.4, 1.05, .5)));
  }
  return d;
}
vec2 mapBack(vec3 p){
  vec2 res = vec2(p.y, 1.);
  float dc = BH - p.y; if(dc<res.x) res = vec2(dc, 2.);
  vec2 c = floor(p.xz/BS);
  vec2 q = p.xz - c*BS;
  float dw = bEdge(c, q.x, q.y, 0., p.y);
  dw = min(dw, bEdge(c+vec2(1,0), q.x-BS, q.y, 0., p.y));
  dw = min(dw, bEdge(c, q.y, q.x, 1., p.y));
  dw = min(dw, bEdge(c+vec2(0,1), q.y-BS, q.x, 1., p.y));
  dw = min(dw, min(min(q.x, BS-q.x), min(q.y, BS-q.y)) + .12);
  if(dw<res.x) res = vec2(dw, 4.);
  return res;
}
float panelMask(vec2 xz, out vec2 pid){ vec2 g = xz/2.5; pid=floor(g); vec2 f=(fract(g)-.5)*2.5; return step(abs(f.x),.62)*step(abs(f.y),.3); }
float panelOn(vec2 pid){ float h=h21(pid+.3); if(h<.1) return 0.; if(h<.17) return step(.45, vnoise(vec2(uGT*11., h*50.))); return 1.; }
float bLight(vec3 p, vec3 n){
  vec2 b = floor(p.xz/2.5 - .5);
  float acc = 0.;
  for(int i=0;i<2;i++) for(int j=0;j<2;j++){
    vec2 pid = b + vec2(i,j);
    vec3 L = vec3((pid.x+.5)*2.5, BH-.02, (pid.y+.5)*2.5) - p;
    float d2 = dot(L,L); L *= inversesqrt(d2);
    acc += panelOn(pid) * (max(dot(n,L),0.)*.75+.25) / (1.+d2*.22);
  }
  return acc;
}

/* ---------- library (world = local) ---------- */
const float LR = 11.0, LRi = 7.55, LH = 5.5;
vec3 hexFrame(vec2 p){
  float a = atan(p.y, p.x);
  float sec = floor(a/(PI/3.) + .5);
  vec2 q = rot2(-sec*PI/3.)*p;
  return vec3(q.x, q.y, sec);
}
float hexAp(vec2 p){ return max(abs(p.x), max(abs(.5*p.x + .8660254*p.y), abs(.5*p.x - .8660254*p.y))); }
vec2 mapLib(vec3 p){
  vec3 hf = hexFrame(p.xz);
  float ap = hf.x;
  vec2 res = vec2(LR - ap, 10.);
  float k = floor(p.y/LH); float ly = p.y - k*LH;
  for(int j=0;j<2;j++){
    float yy = ly - float(j)*LH;
    float kk = k + float(j);
    float dSlab = max(max(LRi - ap, ap - LR - 1.), abs(yy+.175)-.175);
    if(dSlab<res.x) res = vec2(dSlab, 11.);
    float dRail = length(vec2(ap-(LRi+.06), yy-1.)) - .05;
    float tb = mod(hf.y, .4) - .2;
    dRail = min(dRail, max(length(vec2(ap-(LRi+.06), tb)) - .025, abs(yy-.5)-.5));
    if(dRail<res.x) res = vec2(dRail, 12.);
    if(mod(kk, 3.)==0.){
      float ang = mod(kk/3., 3.)*PI/3.;
      vec2 bq = rot2(-ang)*p.xz;
      float dBr = max(sdBox2(vec2(bq.y, yy+.175), vec2(1.1,.175)), ap-LRi-.2);
      float dBrR = max(sdBox2(vec2(abs(bq.y)-1.06, yy-.5), vec2(.04,.5)), ap-LRi-.2);
      dBr = min(dBr, dBrR);
      if(dBr<res.x) res = vec2(dBr, 13.);
    }
  }
  float ly2 = mod(p.y - 3.9 + LH*.5, LH) - LH*.5;
  float dL = length(vec3(p.x, ly2, p.z)) - .42;
  gLamp = dL;
  dL = min(dL, length(p.xz) - .018);
  if(dL<res.x) res = vec2(dL, 14.);
  return res;
}

/* ---------- cathedral of weights (local) ---------- */
vec2 mapCath(vec3 p){
  vec2 cid = floor(p.xz/16. + .5);
  vec2 q = p.xz - cid*16.;
  vec2 qa = abs(q);
  float dP = length(q) - 1.35;
  dP = min(dP, length(qa - vec2(1.12)) - .48);
  dP = min(dP, sdBox(vec3(q.x, p.y-.7, q.y), vec3(2.1,.7,2.1)) - .04);
  dP = min(dP, sdBox(vec3(q.x, p.y-1.55, q.y), vec3(1.85,.15,1.85)));
  vec2 res = vec2(dP, 20.);
  float yy = max(p.y - 28., 0.);
  float bx = 8. - qa.x, bz = 8. - qa.y;
  float air1 = max(length(vec2(bx-2.5, yy)), length(vec2(bx+2.5, yy))) - 10.5;
  float air2 = max(length(vec2(bz-2.5, yy)), length(vec2(bz+2.5, yy))) - 10.5;
  float dV = -min(air1, air2);
  if(dV<res.x) res = vec2(dV, 21.);
  if(p.y<res.x) res = vec2(p.y, 22.);
  return res;
}

/* ---------- the void: stairs, tower, fragments (world) ---------- */
const float SP = 7.2, SN = 24., SR0 = 2.2, SR1 = 5.6;
const float STR = .42, STH = .30;
float helixD(vec3 p){
  float r = length(p.xz);
  float a = atan(p.z, p.x);
  float s = a/TAU*SN;
  float si = floor(s);
  float rise = SP/SN;
  float base = si*rise;
  float n = floor((p.y - base + .17)/SP + .5);
  float top = base + n*SP;
  float dr = max(SR0 - .05 - r, r - SR1);
  float d = max(abs(p.y-(top-.17))-.17, dr);
  float fs = s - si, arc = TAU/SN*r;
  d = min(d, max(max((1.-fs)*arc, abs(p.y-(top+rise-.17))-.17), dr));
  d = min(d, max(max(fs*arc, abs(p.y-(top-rise-.17))-.17), dr));
  return min(d, r - SR0);
}
vec2 mapVoid(vec3 p){
  vec3 q = p - ST0;
  float k = clamp(floor(q.z/STR), 0., STK);
  float d = 1e5;
  for(int j=-1;j<=1;j++){ float kk = clamp(k+float(j), 0., STK);
    d = min(d, sdBox(q - vec3(0., kk*STH - .3, kk*STR + STR*.5), vec3(1.6, .3, STR*.5))); }
  float L = sqrt(1. + (STH/STR)*(STH/STR));
  float wv = (q.y - STH/STR*q.z)/L;
  float slab = max(max(abs(q.x)-1.6, max(wv, -wv - .86/L)), max(-q.z - .1, q.z - (STK+1.)*STR));
  if(slab > .3) d = min(d, slab + .1);
  d = min(d, sdBox(q - vec3(0., STK*STH - .3, (STK+1.)*STR + 1.25), vec3(2.4, .3, 1.25)));
  vec2 res = vec2(d, 30.);
  float dt = helixD((p - TOWER)/3.5)*3.5;
  if(dt<res.x) res = vec2(dt, 31.);
  vec3 cell = floor(p/26. + .5);
  bool skip = (cell.x >= -5. && cell.x <= -3.) || abs(cell.x) <= 1. || (cell.x >= -7. && cell.x <= -5. && cell.z >= 4. && cell.z <= 6.);
  if(!skip){
    vec3 w = p - cell*26.;
    float hh = h31(cell);
    w.xz = rot2(floor(hh*4.)*PI*.5)*w.xz;
    if(fract(hh*7.3)>.5) w.xy = rot2(PI*.5)*w.xy;
    if(fract(hh*3.1)>.6) w.yz = rot2(-PI*.5)*w.yz;
    w += vec3(2.1, 1.8, 0.) + (vec3(h31(cell+1.), h31(cell+2.), h31(cell+3.))-.5)*7.;
    float kx = clamp(floor(w.x/.35), 0., 13.);
    float dS = 1e5;
    for(int j=-1;j<=1;j++){ float kk = clamp(kx+float(j),0.,13.);
      dS = min(dS, sdBox(w - vec3(kk*.35+.175, kk*.3-.3, 0.), vec3(.175,.3,1.))); }
    dS = min(dS, sdBox(w - vec3(14.*.35+1.1, 13.*.3-.1, 0.), vec3(1.1,.1,1.1)));
    dS = min(dS, sdBox(w - vec3(-1.1, -.4, 0.), vec3(1.1,.1,1.1)));
    vec3 bq = abs(p - cell*26.);
    dS = min(dS, 13. - max(bq.x, max(bq.y, bq.z)) + .3);
    if(dS<res.x) res = vec2(dS, 32.);
  }
  return res;
}

/* ---------- the hall of weird parts (local, q = p - M0) ---------- */
float sdClip(vec3 p){
  float r = .07;
  float d1 = length(vec2(abs(sdSeg2(p.xz, vec2(-.8,0.), vec2(.8,0.)) - .42), p.y)) - r;
  float d2 = length(vec2(abs(sdSeg2(p.xz, vec2(-.45,0.), vec2(.95,0.)) - .25), p.y)) - r;
  return min(d1, d2);
}
float memeBanner(vec3 q, out float kx){
  kx = clamp(floor((13.2 - q.x)/8.5 + .5), 0., 3.);
  float bxc = 13.2 - 8.5*kx;
  float d = sdBox(q - vec3(bxc, 8.5, 0.), vec3(.06, 1.1, 5.));
  d = min(d, max(length(vec2(q.x - bxc, abs(q.z) - 4.8)) - .03, abs(q.y - 11.55) - 1.95));
  return d;
}
vec2 mapMeme(vec3 q){
  vec2 res = vec2(q.y, 60.);
  float c = 13.5 - q.y; if(c<res.x) res = vec2(c, 62.);
  float mw = 8. - abs(q.z); if(mw<res.x) res = vec2(mw, 61.);
  float kx; float dB = memeBanner(q, kx);
  if(dB<res.x) res = vec2(dB, 64.);
  // paperclip drifts on the floor
  if(q.x > -16. && q.x < 12. && abs(q.z) < 7.2 && q.y < 1.4){
    vec2 cid = floor(q.xz/3.);
    vec2 lq = q.xz - (cid + .5)*3.;
    float h = h21(cid*1.7 + 3.);
    float dC = 1e5;
    for(int j=0;j<2;j++){
      float hj = h21(cid + float(j)*9.1);
      vec3 w = vec3(lq.x, q.y - .09 - float(j)*.2 - hj*.12, lq.y);
      w.xz = rot2(hj*6.283 + float(j)*1.3)*w.xz;
      w.xy = rot2((hj - .5)*.35)*w.xy;
      dC = min(dC, sdClip(w*1.05)/1.05);
    }
    vec2 bq = abs(lq);
    dC = min(dC, 1.5 - max(bq.x, bq.y) + .05);
    if(h > .25 && dC<res.x) res = vec2(dC, 67.);
  }
  // the door that isn't there
  vec3 dq = q - vec3(.2, 0., 5.9);
  float frame = max(sdBox(dq - vec3(0., 1.25, 0.), vec3(.12, 1.3, .75)), -sdBox(dq - vec3(0., 1.1, 0.), vec3(.3, 1.1, .55)));
  if(frame<res.x) res = vec2(frame, 65.);
  float pane = sdBox(dq - vec3(0., 1.1, 0.), vec3(.02, 1.1, .55));
  if(pane<res.x) res = vec2(pane, 66.);
  float sign = sdBox(dq - vec3(0., 3.05, 0.), vec3(.05, .38, 1.3));
  if(sign<res.x) res = vec2(sign, 63.);
  return res;
}

/* ---------- the transformer (local, q = p - X0) ---------- */
vec2 mapXF(vec3 q){
  vec2 res = vec2(q.y, 80.);
  float k = clamp(floor((q.y - 3.)/9. + .5), 1., 6.);
  float yk = 3. + 9.*k;
  float dR = max(abs(q.y - yk) - .22, 7. - max(abs(q.x), abs(q.z)));
  if(dR<res.x) res = vec2(dR, 82.);
  float dBm = max(length(q.xz) - .22, q.y - 60.);
  if(dBm<res.x) res = vec2(dBm, 83.);
  return res;
}

/* ---------- the context window (local, q = p - T0) ---------- */
vec2 mapCtx(vec3 q){
  float zz = mod(q.z, 4.) - 2.;
  float rib = max(abs(zz) - .1, -sdBox2(vec2(q.x, q.y - 2.5), vec2(2.72, 2.22)));
  rib = max(rib, max(.5 - q.z, q.z - 61.5));
  return vec2(rib, 91.);
}

/* ---------- the red corridor (local) ---------- */
const float DZ = 16.0, DW = .8, DH = 1.45;
vec2 mapCorr(vec3 p){
  vec2 res = vec2(1.5 - abs(p.x), 40.);
  float zz = mod(p.z, 2.4) - 1.2;
  float dPil = max(sdBox(vec3(abs(p.x)-1.5, p.y-3.75, zz), vec3(.24, 3.75, .2)), max(p.z - (DZ-.6), .6 - p.z));
  float dBeam = max(sdBox(vec3(p.x, p.y-7.25, zz), vec3(1.6, .28, .16)), max(p.z - (DZ-.6), .6 - p.z));
  dPil = min(dPil, dBeam);
  if(dPil<res.x) res = vec2(dPil, 46.);
  if(p.y<res.x) res = vec2(p.y, 41.);
  float dc = 7.5 - p.y; if(dc<res.x) res = vec2(dc, 42.);
  float dEnd = max(abs(p.z-(DZ+.1))-.1, -sdBox2(vec2(p.x, p.y-DH), vec2(DW+.02, DH+.01)));
  if(dEnd<res.x) res = vec2(dEnd, 43.);
  vec3 q = p - vec3(-DW, DH, DZ+.03);
  q.xz = rot2(-uP.x)*q.xz;
  float dD = sdBox(q - vec3(DW-.01,0.,0.), vec3(DW-.02, DH-.02, .04));
  if(dD<res.x) res = vec2(dD, 44.);
  if(uZ2.z > .5){ float dL = DZ + .22 - p.z; if(dL<res.x) res = vec2(dL, 45.); }
  return res;
}
float doorGlow(vec3 ro, vec3 rd){
  float tz = (DZ - ro.z)/rd.z;
  if(tz<=0.) return 0.;
  vec3 q = ro + rd*tz;
  float e = sdBox2(vec2(q.x, q.y-DH), vec2(DW, DH));
  return exp(-abs(e)*11.)*(1.7+uP.y*2.) + exp(-max(e,0.)*2.2)*uP.y*1.3;
}

/* ---------- the whole mind (world) ---------- */
float menger(vec3 p, float iters){
  float d = sdBox(p, vec3(1.));
  float s = 1.; gTrap = 0.;
  for(int m=0;m<8;m++){
    if(float(m) >= iters) break;
    vec3 a = mod(p*s, 2.)-1.;
    s *= 3.;
    vec3 r = abs(1.-3.*abs(a));
    float da=max(r.x,r.y), db=max(r.y,r.z), dc=max(r.z,r.x);
    float c = (min(da,min(db,dc))-1.)/s;
    if(c>d){ d=c; gTrap=float(m+1); }
  }
  return d;
}
vec2 mapMind(vec3 p){
  float S = uMind.w;
  float fpd = max(length(p - uCamPos)*uCellAng, .001);
  float it = clamp(log(S*3./(fpd*4.5))/log(3.), 2., 8.);
  float d = menger((p - uMind.xyz)/S, it)*S;
  return vec2(d, 70.+gTrap);
}

/* ---------- regions and the joined world ---------- */
float regBack(vec3 p){ return sdBox(p - vec3(31.5, 1.45, -2.5), vec3(20., 1.75, 20.)); }
float regLib(vec3 p){ return max(hexAp(p.xz) - 11.3, abs(p.y + 25.) - 70.); }
float regCath(vec3 p){ return sdBox(p - vec3(-153., -29.8, 0.), vec3(99., 22.3, 120.)); }
float regMeme(vec3 p){ return sdBox(p - vec3(-33.2, -20.75, 0.), vec3(20.8, 6.75, 8.3)); }
float regXF(vec3 p){ return sdBox(p - vec3(-108.4, -85.8, 0.), vec3(13., 32.2, 13.)); }
float regCtx(vec3 p){ return sdBox(p - vec3(-108.4, -115.5, 44.), vec3(3., 2.5, 31.5)); }
float regCtxCarve(vec3 p){ return sdBox(p - vec3(-108.4, -115.5, 44.), vec3(3., 2.5, 31.)); }
float regCorr(vec3 p){ return sdBox(p - D0 - vec3(0., 3.75, 8.125), vec3(2., 4.25, 8.125)); }
float regVoid(vec3 p){
  float r = sdBox(p - vec3(-75., -236.8, 0.), vec3(325., 183.2, 300.));
  r = max(r, -regLib(p));
  r = max(r, -regXF(p));
  r = max(r, -regCtxCarve(p));
  return max(r, -regCorr(p));
}
float gBest, gMat;
void zoneAcc(float r, vec2 h, float bmat){
  float d = min(h.x, -r);
  if(d > gBest){ gBest = d; gMat = h.x < -r ? h.y : bmat; }
}
void zoneOut(float r, float bmat){ if(-r > gBest){ gBest = -r; gMat = bmat; } }
vec2 map(vec3 p){
  gLamp = 1e5; gBest = -1e9; gMat = 0.;
  float r;
#ifdef Z_BACK
  r = regBack(p); if(r > 0.) zoneOut(r, 4.); else zoneAcc(r, mapBack(p - B0), 4.);
#endif
#ifdef Z_LIB
  r = regLib(p); if(r > 0.) zoneOut(r, 15.); else zoneAcc(r, mapLib(p), 15.);
#endif
#ifdef Z_CATH
  r = regCath(p); if(r > 0.) zoneOut(r, 23.); else zoneAcc(r, mapCath(p - C0), 23.);
#endif
#ifdef Z_VOID
  r = regVoid(p); if(r > 0.) zoneOut(r, 35.); else zoneAcc(r, mapVoid(p), 35.);
#endif
#ifdef Z_MEME
  r = regMeme(p); if(r > 0.) zoneOut(r, 63.); else zoneAcc(r, mapMeme(p - M0), 63.);
#endif
#ifdef Z_XF
  r = regXF(p); if(r > 0.) zoneOut(r, 81.); else zoneAcc(r, mapXF(p - X0), 81.);
#endif
#ifdef Z_CTX
  r = regCtx(p); if(r > 0.) zoneOut(r, 90.); else zoneAcc(r, mapCtx(p - T0), 90.);
#endif
#ifdef Z_CORR
  r = regCorr(p); if(r > 0.) zoneOut(r, 47.); else zoneAcc(r, mapCorr(p - D0), 47.);
#endif
#ifdef Z_MIND
  r = -regCorr(p); if(r > 0.) zoneOut(r, 72.); else zoneAcc(r, mapMind(p), 72.);
#endif
  float dt;
#ifdef C_BD
  dt = -sdBox(p - vec3(11.15, 1.25, 0.), vec3(.75, 1.25, .65)); if(dt > gBest){ gBest = dt; gMat = 50.; }
#endif
#ifdef C_LD
  dt = -sdBox(p - vec3(-11.6, -26.2, 0.), vec3(1.2, 1.3, .65)); if(dt > gBest){ gBest = dt; gMat = 50.; }
#endif
#ifdef C_MD
  dt = -sdBox(p - vec3(-54.2, -25.8, 0.), vec3(1.1, 2.3, 1.6)); if(dt > gBest){ gBest = dt; gMat = 50.; }
#endif
#ifdef C_HOLE
  dt = -max(length(p.xz - HOLE.xz) - 6., abs(p.y - HOLE.y) - 1.5); if(dt > gBest){ gBest = dt; gMat = 51.; }
#endif
#ifdef C_CORR
  dt = -sdBox(p - vec3(D0.x, D0.y + 3.75, D0.z), vec3(1.5, 3.75, .5)); if(dt > gBest){ gBest = dt; gMat = 50.; }
#endif
#ifdef Z_MIND
  dt = -sdBox(p - vec3(D0.x, D0.y + DH, D0.z + DZ + .3), vec3(DW + .02, DH + .01, .55)); if(dt > gBest){ gBest = dt; gMat = 50.; }
#endif
  return vec2(gBest, gMat);
}
int zoneOf(float m){
  if(m < 9.5) return 0; if(m < 16.) return 1; if(m < 24.) return 2; if(m < 36.) return 3;
  if(m < 47.) return 4; if(m < 52.) return 5; if(m < 59.) return 5;
  if(m < 68.) return 7; if(m < 80.) return 6; if(m < 86.) return 8; if(m < 96.) return 9; return 6;
}
vec3 calcN(vec3 p, float e){ vec2 k=vec2(1,-1);
  return normalize(k.xyy*map(p+k.xyy*e).x + k.yyx*map(p+k.yyx*e).x + k.yxy*map(p+k.yxy*e).x + k.xxx*map(p+k.xxx*e).x); }
float calcAO(vec3 p, vec3 n, float s){ float o=0., w=1.;
  for(int i=1;i<=4;i++){ float h=s*float(i)/4.; float d=map(p+n*h).x; o+=(h-d)*w; w*=.7; }
  return clamp(1.-o*1.5/s, 0., 1.); }

const vec3 SUN = normalize(vec3(-.35,.5,.8));
vec3 mindSky(vec3 ro, vec3 rd){
  float h = rd.y;
  vec3 c = mix(vec3(.16,.07,.12), vec3(.03,.025,.09), smoothstep(-.3,.6,h));
  float hc = max(dot(rd, normalize(uMind.xyz - ro)), 0.);
  c += vec3(1.,.55,.35)*pow(hc, 7.)*.42 + vec3(.6,.35,.8)*pow(hc, 2.5)*.14;
  float sd = max(dot(rd,SUN),0.);

float attnW(float i, float j){
  if(j > i) return 0.;

  if(i == 10. && j == 1.) w = .75;
  if(i == 8. && j == 7.) w = .7;

void shadeCtx(vec3 q, vec3 pw, vec3 rd, float fp, float m, out vec3 col, out int code){
  vec3 n = calcN(pw, .002);
  float fpn = fp/max(abs(dot(n,rd)),.2);
  float behind = uCamPos.z - pw.z;
  float lost = smoothstep(8., 13., behind);
  if(m==91.){ col = vec3(.2,.7,.4)*(.35 - .25*lost); code = abs(n.z) > .5 ? 43 : 61; return; }
  vec2 st = faceST(q, n);
  if(n.x > .6 && q.y > 3.0 && q.y < 4.7 && q.z > 26. && q.z < 46.){
    float ink; int tc = signText(vec2(st.x - 27., 4.65 - q.y), 19., 1., .9, fpn, .8, ink);

  if(f.y < lw.y || f.y > 1. - lw.y){ col = vec3(.2,.8,.45)*.3*br; code = 45; return; }
  float cw = .16;
  float ci = floor((f.x*bs.x - (bs.x - 4.*cw)*.5)/cw);

void shadeMind(vec3 p, vec3 rd, float t, float fp, float m, out vec3 col, out int code){

/* ================= the web of words (analytic, depth tested) ================= */
void renderWeb(vec3 ro, vec3 rd, float tLim, bool miss, inout vec3 col, inout int code){
  float best = tLim;
  bool hit = false;
  vec3 halo = vec3(0.);
  float cellAngY = uCellAng*uCell.y/uCell.x;
  for(int i=0;i<256;i++){
    if(i>=uEdgeCount) break;
    vec4 A = texelFetch(uData, ivec2(i,1), 0);
    vec4 B = texelFetch(uData, ivec2(i,2), 0);
    vec3 ba = B.xyz-A.xyz; vec3 w0 = ro-A.xyz;
    float b = dot(rd,ba), c = dot(ba,ba), d = dot(rd,w0), e = dot(ba,w0);
    float den = c - b*b;
    float s = clamp((e - b*d)/max(den,1e-5), 0., 1.);
    float t = b*s - d;
    if(t<.3 || t>best) continue;
    vec3 P = A.xyz + ba*s;
    float dist = length(ro+rd*t - P);
    vec2 sd = projDir(P, ba);
    vec2 sdp = normalize(sd);
    float thr = .5*(abs(sdp.y)*uCellAng + abs(sdp.x)*cellAngY);
    if(dist/t < thr){
      best = t; hit = true;
      float wgt = A.w;
      float layer = floor(B.w);
      float pulse = fract(uGT*.55 + fract(B.w));
      vec3 hue = layer < .5 ? vec3(.42,.34,.95) : layer < 1.5 ? vec3(.3,.8,1.) : layer < 2.5 ? vec3(.4,1.,.55) : layer < 3.5 ? vec3(1.,.8,.3) : layer < 4.5 ? vec3(1.,.4,.75) : vec3(.7,.55,1.);
      vec3 ec = mix(hue, vec3(1.,.5,.34), smoothstep(.55,.95,wgt));
      col = ec*(.7+1.6*wgt)*exp(-t*.022);
      code = dirChar(sd);
      if(abs(s - pulse)<.035){ col = mix(col, vec3(1.,.9,.85), .7)*1.3; code = wgt>.6 ? 64 : 42; }
    }
  }
  for(int i=0;i<160;i++){
    if(i>=uNodeCount) break;
    vec4 N = texelFetch(uData, ivec2(i,0), 0);
    vec3 v = N.xyz - ro;
    float tca = dot(v, rd);
    if(tca<.3 || tca > tLim) continue;
    float d2 = dot(v,v) - tca*tca;
    float R = .05 + .06*N.w;
    float dd = sqrt(max(d2,0.));
    float ang = dd/tca;
    float nr = R/tca;
    halo += vec3(.75,.65,1.)*exp(-ang/(uCellAng*2.))*(.16+.35*N.w)*exp(-tca*.03);
    if(ang < nr + .5*uCellAng && tca-R < best){
      best = tca-R; hit = true;
      float br = (1.2+1.2*N.w)*exp(-tca*.02);
      vec3 nc = mix(vec3(.85,.8,1.), vec3(1.,.62,.45), step(.5,N.w));
      if(nr > 1.6*uCellAng){
        float th = sqrt(max(R*R-d2,0.));
        vec3 P = ro + rd*(tca-th); vec3 nn = normalize(P - N.xyz);
        float l = .25 + .75*max(dot(nn, normalize(vec3(-.3,.6,-.7))),0.);
        col = nc*br*l; code = rampChar(.35+.65*l);
      } else { col = nc*br; code = nr > .7*uCellAng ? 64 : nr > .35*uCellAng ? 111 : 42; }
    }
  }
  float hl = luma(halo);
  if(!hit && hl > .05){ col += halo*.8; if(code==32 || luma(col) < .08) code = hl>.28 ? 58 : 46; }
  else col += halo*.2;
  if(miss && !hit){
    vec3 sc3 = floor(rd/uCellAng*.9);
    float hs = h31(sc3);
    if(hs>.978 && code==32){ code = hs>.996 ? 43 : 46; col = vec3(.45,.4,.75)*(.5+.5*h31(sc3+3.)); }
  }
}

void renderMarch(vec3 ro, vec3 rd, out vec3 col, out int code){
  float t = .03; float m = -1.; float glow = 0.;
  vec3 tint = vec3(1.); float tPre = 0.;
  vec3 ro0 = ro;
  for(int b=0;b<2;b++){
    t = .03; m = -1.;
    for(int i=0;i<140;i++){
      vec3 p = ro+rd*t;
      vec2 h = map(p);
      glow += .05/(1.+gLamp*gLamp*6.);
      if(h.x < .0006*(t+tPre) + .0004){ m = h.y; break; }
      t += h.x*.82;
      if(t+tPre>uTMax) break;
    }
#ifdef MIRRORS
    if(m == 61. && b == 0){
      vec3 p = ro + rd*t; vec3 n = calcN(p, .002);
      tPre += t; ro = p + n*.03; rd = reflect(rd, n); tint = vec3(.62,.8,1.)*.85; continue;
    }
#endif
    break;
  }
  vec3 fogC; float fogK;
  int z = m < 0. ? uCamZone : zoneOf(m);
  if(z==5) z = uCamZone;
  zoneFog(z, ro, rd, fogC, fogK);
  if(m < 0. && uZoneMix < 1.){ vec3 f2; float k2; zoneFog(uPrevZone, ro, rd, f2, k2); fogC = mix(f2, fogC, uZoneMix); }
  if(m<0.){
    col = fogC; code = rampChar(luma(col)*.8);
    if(z==6){
      float sd = max(dot(rd,SUN),0.);
      code = rampChar(luma(col)*.42*(.5+h21(floor(rd.xy/uCellAng))));
      vec3 s3 = floor(rd/uCellAng*.9);
      if(h31(s3)>.985){ code = h31(s3+1.)>.8 ? 43 : 46; col = vec3(.8,.75,1.)*.6; }
      if(sd>.9994) code = 64;
    }
    if(z==3) code = rampChar(luma(col)*.9);
  } else {
    shade(ro, rd, t, m, col, code);
    col *= tint;
    float f = exp(-(t+tPre)*fogK);
    col = mix(fogC, col, f);
    if(f<.35) code = rampChar(luma(col)*.85);
  }
  if(glow > .02){ col += vec3(1.,.72,.38)*glow*.9; if(glow>.12 && code==32) code = glow>.35?58:46; }
#ifdef Z_CORR
  if(uZ2.z > .5){
    vec3 rl = ro - D0;
    float tz = (DZ - rl.z)/rd.z;
    if(tz>0. && rl.z < DZ && (m<0. || t>tz-.2)){
      vec3 q = rl + rd*tz;
      if(abs(q.x) < 1.6 && q.y > -.2 && q.y < 3.6){
        float g = doorGlow(rl, rd);
        float e = sdBox2(vec2(q.x, q.y-DH), vec2(DW, DH));
        col += vec3(1.,.95,.88)*g;
        if(g>.3 && (e>0. || m==44.)) code = g>1.? 35 : g>.6 ? 43 : 58;
      }
    }
  }
#endif
#ifdef WEB
  if(z==8 || (m<0. && uCamZone==8)) renderWeb(ro, rd, m<0. ? 400. : t, m<0., col, code);
#endif
#ifdef Z_MIND
  if(uP.z > 0.){
    vec3 v = uDoorW - ro; float tb = dot(v, rd);
    if(tb > 0. && (m<0. || t > tb - 2.)){
      float ang = length(v - rd*tb)/tb;
      float g = exp(-ang/(uCellAng*1.2))*uP.z;
      col += vec3(1.,.9,.75)*g*1.6;
      if(g > .5) code = g > .9 ? 64 : 42; else if(g > .15 && code==32) code = 43;
    }
  }
#endif
}

void main(){
#ifdef PROBE
  vec3 pp = texelFetch(uProbe, ivec2(gl_FragCoord.xy), 0).xyz;
  vec2 hh = map(pp);
  oCol = vec4(hh.x, hh.y, 0., 1.);
#else
  vec2 px = gl_FragCoord.xy * uCell;
  float mr = min(uRes.x, uRes.y);
  vec2 uv = (px - .5*uRes)/(.5*mr);
  vec3 rd = normalize(uv.x*uCamR + uv.y*uCamU + uFocal*uCamF);
  vec3 col; int code;
  renderMarch(uCamPos, rd, col, code);
  col = vec3(1.) - exp(-col*1.35);
  float mx = max(col.r, max(col.g, col.b));
  col = col/max(mx, 1e-4) * pow(mx, .62);
  oCol = vec4(col, float(code-32)/255.);
#endif
}

  progComp = program(FS_COMP);
  const len = CORPUS_FULL.length, ch = Math.ceil(len/1024), cb = new Uint8Array(1024*ch).fill(32);
  for (let i = 0; i < len; i++){ const c = CORPUS_FULL.charCodeAt(i); cb[i] = (c >= 32 && c < 127) ? c : 32; }
  corpusTex = tex(1024, ch, gl.R8, gl.RED, gl.UNSIGNED_BYTE, cb, gl.NEAREST);
  dataTex = tex(256, 3, gl.RGBA32F, gl.RGBA, gl.FLOAT, gData, gl.NEAREST);
  atlasS = makeAtlas(700); atlasN = makeAtlas(500);
  setupSize();
}

/* ---------------------------------------------------------------- overlays */
function hashN(a, b){ let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35); h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); return ((h ^ (h >>> 15)) >>> 0)/4294967296; }
function wrapText(text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words){ if (cur && (cur.length + 1 + w.length) > maxW){ lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }
  if (cur) lines.push(cur); return lines;
}
function putN(col, row, code, alpha, accent){
  if (col < 0 || row < 0 || col >= ncols || row >= nrows) return;
  const i = ((nrows-1-row)*ncols + col)*4; narrBuf[i] = code; narrBuf[i+1] = Math.round(clamp01(alpha)*255); narrBuf[i+2] = accent ? 255 : 0;
}
function putL(col, row, code, alpha, accent){
  if (col < 0 || row < 0 || col >= cols || row >= rows) return;
  const i = ((rows-1-row)*cols + col)*4; labelBuf[i] = code; labelBuf[i+1] = Math.round(clamp01(alpha)*255); labelBuf[i+2] = accent ? 255 : 0;
}
const band = { x: 0, y: 0, hw: 0, hh: 0, a: 0 };
function drawNarration(t){
  narrBuf.fill(0);
  const frame = Math.round(t*30);
  const portrait = H > W;
  const maxW = Math.min(ncols - 4, portrait ? 34 : 50);
  let bandRows = null, bandCols = 0, bandA = 0;
  for (let li = 0; li < TL.lines.length; li++){
    const L = TL.lines[li];
    const kind = L.kind || 'line';
    if ((t < L.t0 && !(li === 0 && kind === 'prompt')) || t > L.t1 + .4) continue;
    const out = clamp01((L.t1 + .35 - t)/.35);
    const lines = kind === 'line' ? wrapText(L.text, maxW) : [L.text];
    let row0;
    if (kind === 'prompt') row0 = Math.floor(nrows/2);
    else if (kind === 'card' || kind === 'cardprompt') row0 = Math.floor(nrows/2) + (L.row || 0);
    else row0 = nrows - (portrait ? 7 : 4) - lines.length + 1;
    let idx = 0, lastTyped = -1;
    const widest = Math.max(...lines.map(s => s.length));
    for (let r = 0; r < lines.length; r++){
      const s = lines[r];
      const col0 = kind === 'card' || kind === 'cardprompt' ? Math.floor((ncols - (kind === 'cardprompt' ? 13 : 30))/2) : Math.floor((ncols - s.length)/2);
      for (let k = 0; k < s.length; k++, idx++){
        const a = L.t0 + idx*TL.cps;
        if (t < a) continue;
        lastTyped = idx;
        let code = s.charCodeAt(k), accent = false;
        if (code === 32) continue;
        if (t < a + .1){ code = 33 + Math.floor(hashN(idx*7 + li*131, frame)*93); accent = true; }
        if ((kind === 'prompt' || kind === 'cardprompt') && k === 0) accent = true;
        putN(col0 + k, row0 + r, code, out*clamp01((t - a)/.04 + .3), accent);
      }
      idx++;
      if (kind !== 'card' && kind !== 'cardprompt') { bandRows = bandRows || [row0, row0]; bandRows[1] = row0 + r; bandCols = Math.max(bandCols, widest); bandA = Math.max(bandA, out); }
    }
    if (kind === 'prompt' || kind === 'cardprompt'){
      const s = lines[0], col0 = kind === 'cardprompt' ? Math.floor((ncols - 13)/2) : Math.floor((ncols - s.length)/2);
      const typedAll = t >= L.t0 + (s.length-1)*TL.cps;
      const cx = col0 + (typedAll ? s.length + 1 : lastTyped + 1);
      if (Math.floor(t*2.2) % 2 === 0 || (!typedAll && t >= L.t0)) putN(cx, row0, 95, out, true);
    }
  }
  if (bandRows){
    band.x = W/2; band.hw = (bandCols/2 + 1.5)*ncw;
    const noffY = (H - nrows*nch)/2;
    const yTop = noffY + (nrows - bandRows[0])*nch, yBot = noffY + (nrows - 1 - bandRows[1])*nch;
    band.y = (yTop + yBot)/2; band.hh = (yTop - yBot)/2 + nch*.35; band.a = bandA;
  } else band.a = 0;
}
function drawLabels(t, cam){
  labelBuf.fill(0);
  if (camZoneAt(t) === 8 && t > TL.zones.webOn[0] && t < TL.zones.webOn[1]){
    const hi = S(TL.attention, TL.attention + 1.1, t);
    const mr = Math.min(W, H);
    for (let i = 0; i < graph.nodes.length; i++){
      const n = graph.nodes[i];
      const v = [n.p[0]-cam.pos[0], n.p[1]-cam.pos[1], n.p[2]-cam.pos[2]];
      const z = v[0]*cam.F[0]+v[1]*cam.F[1]+v[2]*cam.F[2]; if (z < 1.2 || z > 15) continue;
      const x = (v[0]*cam.R[0]+v[1]*cam.R[1]+v[2]*cam.R[2])/z*cam.focal, y = (v[0]*cam.U[0]+v[1]*cam.U[1]+v[2]*cam.U[2])/z*cam.focal;
      const px = W/2 + x*mr/2, py = H/2 - y*mr/2;
      const c0 = Math.round(px/cellW) + (n.side ? 2 : -1 - n.w.length), r0 = Math.floor(py/cellH);
      const focus = n.key;
      const a = Math.exp(-Math.max(0, z-6)*.08) * (n.key ? (.75 + .25*hi) : (1 - .35*hi*(n.layer === 1 ? 1 : 0))) * S(67, 69, t) * (1 - S(87, 89, t));
      if (a < .08) continue;
      for (let k = 0; k < n.w.length; k++) putL(c0 + k, r0, n.w.charCodeAt(k), a*1.1, focus && hi > .3);
    }
  }
  if (t > TL.signature){
    const s = 'claude', a = S(TL.signature, TL.signature + .8, t)*.55;
    const c0 = Math.floor((cols - s.length)/2), r0 = rows - Math.max(3, Math.round(rows*.08));
    for (let k = 0; k < s.length; k++) putL(c0 + k, r0, s.charCodeAt(k), a, false);
  }
}

/* ---------------------------------------------------------------- frame */
function sceneState(t){
  const sky = t >= TL.zones.sky;
  const doorA = 1.85*S(TL.doorOpen[0], TL.doorOpen[1], t);
  const flood = S(TL.doorOpen[0]+.1, TL.doorOpen[1]+.6, t);
  const beacon = sky ? S(142.3, 145.3, t)*(1 - S(161.8, 165.8, t)*.6) : 0;
  const webOn = t > TL.zones.webOn[0] && t < TL.zones.webOn[1] ? 1 : 0;
  return {
    z1: [t < 22 ? 1 : 0, t > 9 && t < 41.5 ? 1 : 0, t > 44 && t < 74 ? 1 : 0, !sky && t > 90 ? 1 : 0],
    z2: [t > 100 ? 1 : 0, sky ? 1 : 0, sky ? 0 : 1, 0],
    z3: [t > 28 && t < 56 ? 1 : 0, t > 50 && t < 95 ? 1 : 0, t > 80 && t < 110 ? 1 : 0, 0],
    p: [doorA, flood, beacon, webOn],
    carve: [t < 24 ? 1 : 0, t > 30 && t < 41.5 ? 1 : 0, t > 50 && t < 74 ? 1 : 0, t > 110 ? 1 : 0],
    carve2: [t > 44 && t < 56 ? 1 : 0, 0, 0, 0],
  };
}
function render(t){
  t = Math.max(0, Math.min(DUR, t));
  const c = cameraAt(t);
  const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw), cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  const F = [sy*cp, sp, cy*cp];
  let R = norm(cross([0,1,0], F)); let U = cross(F, R);
  const cr = Math.cos(c.roll || 0), sr = Math.sin(c.roll || 0);
  const R2 = [R[0]*cr + U[0]*sr, R[1]*cr + U[1]*sr, R[2]*cr + U[2]*sr];
  const U2 = [U[0]*cr - R[0]*sr, U[1]*cr - R[1]*sr, U[2]*cr - R[2]*sr];
  R = R2; U = U2;
  const cam = { pos: c.pos, F, R, U, focal: c.focal };
  const st = sceneState(t);
  if (st.p[3]) updateGraph(t, cam);
  const cz = camZoneAt(t);

  let dissolve = 0, white = 0, fade = 1;
  if (t < TL.dissolveIn[1]) dissolve = 1 - S(TL.dissolveIn[0], TL.dissolveIn[1], t);
  const scramble = t < TL.dissolveIn[1] && t > TL.dissolveIn[0] ? .5*(1 - S(TL.dissolveIn[0]-.2, TL.dissolveIn[1], t)) : 0;
  const fl = TL.flash;
  if (t > fl[0] && t < fl[2]) white = t < fl[1] ? S(fl[0], fl[1], t) : 1 - S(fl[1], fl[2], t);
  fade = Math.min(1, t/.25) * (1 - .8*S(TL.endDim[0], TL.endDim[1], t));
  const fadeAll = t > DUR - .6 ? clamp01((DUR - t)/.6) : 1;

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, cols, rows);
  const ps = sceneProgram(variantKey(st), false);
  gl.useProgram(ps.p); const u = ps.u;
  gl.uniform2f(u.uRes, W, H); gl.uniform2f(u.uCell, cellW, cellH); gl.uniform2f(u.uGrid, cols, rows);
  gl.uniform1f(u.uGT, t); gl.uniform1i(u.uCamZone, cz); gl.uniform1f(u.uTMax, TMAX[cz]);
  gl.uniform3fv(u.uCamPos, c.pos); gl.uniform3fv(u.uCamR, R); gl.uniform3fv(u.uCamU, U); gl.uniform3fv(u.uCamF, F);
  gl.uniform3fv(u.uDoorW, DOOR);
  gl.uniform1f(u.uFocal, c.focal); gl.uniform1f(u.uCellAng, (2*cellW/Math.min(W, H))/c.focal);
  gl.uniform4fv(u.uCarve, st.carve); gl.uniform4fv(u.uP, st.p); gl.uniform4fv(u.uZ1, st.z1); gl.uniform4fv(u.uZ2, st.z2); gl.uniform4fv(u.uMind, MIND);
  gl.uniform1f(u.uCorpusLen, CORPUS_FULL.length); gl.uniform1f(u.uStepW, STEPW.length);
  gl.uniform1f(u.uStepBase, STEP_BASE); gl.uniform1f(u.uSignBase, SIGN_BASE); gl.uniform1f(u.uNoteBase, NOTE_BASE);
  const zb = zoneBlend(t);
  gl.uniform1i(u.uPrevZone, zb.prev); gl.uniform1f(u.uZoneMix, zb.mix);
  gl.uniform1f(u.uVoidLit, S(TL.voidLit[0], TL.voidLit[1], t));
  gl.uniform1i(u.uEdgeCount, webCounts[1]); gl.uniform1i(u.uNodeCount, webCounts[0]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, corpusTex); gl.uniform1i(u.uCorpus, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasS); gl.uniform1i(u.uAtlas, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, dataTex); gl.uniform1i(u.uData, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, dataTex); gl.uniform1i(u.uProbe, 3);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  drawNarration(t);
  drawLabels(t, cam);
  gl.bindTexture(gl.TEXTURE_2D, narrTex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, ncols, nrows, gl.RGBA, gl.UNSIGNED_BYTE, narrBuf);
  gl.bindTexture(gl.TEXTURE_2D, labelTex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, labelBuf);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(progComp.p); const v = progComp.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cellTex); gl.uniform1i(v.uCells, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasS); gl.uniform1i(v.uAtlasS, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, atlasN); gl.uniform1i(v.uAtlasN, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, labelTex); gl.uniform1i(v.uLabels, 3);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, narrTex); gl.uniform1i(v.uNarr, 4);
  gl.uniform2f(v.uRes, W, H); gl.uniform2f(v.uCell, cellW, cellH); gl.uniform2f(v.uGrid, cols, rows);
  gl.uniform2f(v.uNCell, ncw, nch); gl.uniform2f(v.uNGrid, ncols, nrows); gl.uniform2f(v.uNOff, (W - ncols*ncw)/2, (H - nrows*nch)/2);
  gl.uniform1f(v.uGT, t); gl.uniform1f(v.uScramble, scramble); gl.uniform1f(v.uGlitch, 0); gl.uniform1f(v.uDissolve, dissolve);
  gl.uniform1f(v.uWhite, white); gl.uniform1f(v.uFade, fade); gl.uniform1f(v.uFadeAll, fadeAll);
  gl.uniform1f(v.uLodS, Math.max(0, Math.log2(40/cellW) - .35)); gl.uniform1f(v.uLodN, Math.max(0, Math.log2(40/ncw) - .35));
  gl.uniform4f(v.uBand, band.x, band.y, band.hw, band.hh); gl.uniform1f(v.uBandA, band.a);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------------------------------------------------------------- probe: clearance of the flight path */
function probe(times, pts){
  if (!hasFloatRT) return null;
  const n = times.length, w = 256, h = Math.ceil(n/w);
  const pos = new Float32Array(w*h*4);
  const results = [];
  const outTex = tex(w, h, gl.RGBA32F, gl.RGBA, gl.FLOAT, null, gl.NEAREST);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outTex, 0);
  const groups = {};
  times.forEach((t, i) => { const st = sceneState(t); const key = JSON.stringify([st.z1, st.z2, st.p[0], st.carve, variantKey(st).replace('WEB', '').trim()]); (groups[key] = groups[key] || []).push(i); });
  const out = new Float32Array(w*h*4);
  const all = new Float32Array(n*2);
  for (const key of Object.keys(groups)){
    const idxs = groups[key]; const [z1, z2, dA, cv, vk] = JSON.parse(key);
    const probeProg = sceneProgram(vk, true);
    pos.fill(0);
    idxs.forEach(i => { const p = pts ? pts[i] : posAt(times[i]); pos[i*4] = p[0]; pos[i*4+1] = p[1]; pos[i*4+2] = p[2]; });
    const pt = tex(w, h, gl.RGBA32F, gl.RGBA, gl.FLOAT, pos, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.viewport(0, 0, w, h);
    gl.useProgram(probeProg.p); const u = probeProg.u;
    gl.uniform4fv(u.uZ1, z1); gl.uniform4fv(u.uZ2, z2); gl.uniform4fv(u.uCarve, cv); gl.uniform4f(u.uP, dA, 0, 0, 0); gl.uniform4fv(u.uMind, MIND);
    gl.uniform3fv(u.uCamPos, [0, 0, 0]); gl.uniform1f(u.uCellAng, .01); gl.uniform1f(u.uGT, 0);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, pt); gl.uniform1i(u.uProbe, 3);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, out);
    idxs.forEach(i => { all[i*2] = out[i*4]; all[i*2+1] = out[i*4+1]; });
    gl.deleteTexture(pt);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(outTex);
  for (let i = 0; i < n; i++) results.push([times[i], all[i*2], all[i*2+1]]);
  return results;
}

/* ---------------------------------------------------------------- boot */
const fontsReady = document.fonts ? Promise.all([document.fonts.load('700 40px JBM'), document.fonts.load('500 40px JBM')]).catch(() => {}) : Promise.resolve();
fontsReady.then(() => {
  init();
  if (CAP){
    for (const k of allVariantKeys()) sceneProgram(k, false);
    window.__renderAt = (t) => { render(t); gl.finish(); return true; };
    window.__probe = (ts, pts) => probe(ts, pts);
    window.__cam = (t) => cameraAt(t);
    window.__ready = true;
    return;
  }
  startLive();
});

function startLive(){
  const aud = document.getElementById('aud');
  const gate = document.getElementById('gate'), bar = document.getElementById('bar');
  const bPlay = document.getElementById('bPlay'), bRestart = document.getElementById('bRestart'), bSound = document.getElementById('bSound'), tc = document.getElementById('tc');
  let playing = false, muted = false, t0 = 0, tNow = 19.4, useAudio = false;
  const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2, '0') + ':' + String(s%60).padStart(2, '0'); };
  function clock(){ if (useAudio && !aud.paused && !muted) return aud.currentTime; return (performance.now() - t0)/1000; }
  function play(from){
    playing = true; bPlay.textContent = 'pause';
    t0 = performance.now() - from*1000; useAudio = false;
    if (!muted){ try { aud.currentTime = from; const pr = aud.play(); if (pr) pr.then(() => { useAudio = true; }).catch(() => { useAudio = false; }); } catch (e) {} }
  }
  function pause(){ playing = false; bPlay.textContent = 'play'; aud.pause(); }
  function begin(withSound){ muted = !withSound; bSound.textContent = muted ? 'sound off' : 'sound on'; gate.hidden = true; play(0); poke(); }
  document.getElementById('go').onclick = () => begin(true);
  document.getElementById('goMute').onclick = () => begin(false);
  bPlay.onclick = () => { if (playing) pause(); else play(tNow >= DUR ? 0 : tNow); };
  bRestart.onclick = () => play(0);
  bSound.onclick = () => { muted = !muted; bSound.textContent = muted ? 'sound off' : 'sound on'; if (muted) aud.pause(); else if (playing) play(tNow); };
  let hideT = 0; function poke(){ bar.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.remove('show'), 2200); }
  addEventListener('pointermove', () => { if (gate.hidden) poke(); });
  addEventListener('keydown', e => { if (!gate.hidden) return; if (e.code === 'Space'){ e.preventDefault(); bPlay.click(); } poke(); });
  addEventListener('resize', () => { setupSize(); if (!playing) render(tNow); });
  let last = 0;
  function loop(now){
    requestAnimationFrame(loop);
    if (!playing) return;
    tNow = clock();
    if (tNow >= DUR){ tNow = DUR; pause(); poke(); }
    const f0 = performance.now();
    render(tNow);
    const k = variantKey(sceneState(Math.min(DUR, tNow + 2.5)));
    if (!progCache[k]) { try { sceneProgram(k, false); } catch (e) {} }
    if (lastFrame) { const dt = f0 - lastFrame; ema = ema*.92 + dt*.08; }
    lastFrame = f0;
    if (ema > 55 && f0 - lastDrop > 1500 && LIVE_COLS_MAX > 70) { LIVE_COLS_MAX = Math.round(Math.min(LIVE_COLS_MAX, cols)*.82); setupSize(); lastDrop = f0; ema = 30; }
    const s = Math.floor(tNow); if (s !== last){ last = s; tc.textContent = fmt(tNow) + ' / ' + fmt(DUR); }
  }
  let ema = 30, lastFrame = 0, lastDrop = 0;
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault(); pause();
    const g = document.getElementById('gate'); g.hidden = false;
    g.querySelector('p').textContent = "This device's graphics chip couldn't keep up with the real-time render." + (window.__FALLBACK_MSG || '');
    g.querySelector('.row').hidden = true;
  });
  render(tNow);
  requestAnimationFrame(loop);
}

})();
</script>
