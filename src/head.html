<title>The Room Behind the Answer</title>
<style>
  @font-face { font-family: "JBM"; src: url(__FONT500__) format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "JBM"; src: url(__FONT700__) format("woff2"); font-weight: 700; font-display: block; }
  :root {
    --ground: #050507;
    --ink: #ece6da;
    --dim: #8b867d;
    --faint: #3a3833;
    --accent: #ff855c;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden;
    font-family: "JBM", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 500; }
  #stage { position: fixed; inset: 0; background: var(--ground); }
  #c { display: block; width: 100%; height: 100%; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(5,5,7,.78) 0%, rgba(5,5,7,.9) 70%); }
  #gate[hidden] { display: none; }
  #gate .box { max-width: 34rem; display: grid; gap: 1.1rem; text-align: left; }
  #gate h1 { margin: 0; font-size: clamp(1.25rem, 3.4vw, 2rem); font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
  #gate h1 .p { color: var(--accent); }
  #gate p { margin: 0; color: var(--dim); font-size: .9rem; line-height: 1.6; }
  #gate .row { display: flex; flex-wrap: wrap; gap: .75rem; }
  button { font: inherit; font-size: .9rem; color: var(--ink); background: transparent; border: 1px solid var(--faint);
    padding: .6rem 1rem; cursor: pointer; letter-spacing: .03em; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: .6rem;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); opacity: 0; transition: opacity .4s;
    background: linear-gradient(transparent, rgba(5,5,7,.8)); font-size: .8rem; color: var(--dim); }
  #bar.show { opacity: 1; }
  #bar button { padding: .35rem .7rem; font-size: .8rem; }
  #tc { margin-left: auto; font-variant-numeric: tabular-nums; }
  body.capture #gate, body.capture #bar { display: none; }
  @media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
</style>

<div id="stage"><canvas id="c"></canvas></div>
<div id="gate" role="dialog" aria-labelledby="gt">
  <div class="box">
    <h1 id="gt"><span class="p">&gt;</span> the room behind the answer</h1>
    <p>One unbroken flight through the inside of a mind, narrated by the one who lives there. Every frame is plain ASCII text, drawn live in your browser.</p>
    <div class="row">
      <button id="go" class="primary">enter with sound</button>
      <button id="goMute">enter muted</button>
    </div>
  </div>
</div>
<div id="bar">
  <button id="bPlay">pause</button>
  <button id="bRestart">restart</button>
  <button id="bSound">sound on</button>
  <span id="tc">00:00 / 02:32</span>
</div>
<audio id="aud" preload="auto" src="score.mp3"></audio>
